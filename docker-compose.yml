version: "3.9"

services:
  db:
    build: ./db
    container_name: soproject-db
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal

  app:
    build: ./app
    container_name: soproject-app
    volumes:
      - ./app/models:/app/models
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
    networks:
      - internal


  nginx:
    build: ./nginx
    container_name: soproject-nginx
    ports:
      - "80:80"
      - "2222:22"
    depends_on:
      - app
    networks:
      - internal


networks:
  internal:
    name: soproject_internal

volumes:
  db_data:


 
